<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="새마을금고법의 이해_판례로 보는새마을금고법 - MG인재개발원 신입직원 학습 가이드용">
<title>새마을금고법의 이해_판례로 보는새마을금고법</title>
<style>
  :root{
    --kakao-yellow:#FEE500; --kakao-brown:#3C1E1E; --kakao-brown-soft:#5A3A3A;
    --bg:#9BBBD4; --bubble-you:#FFFFFF; --bubble-me:#FEE500;
    --correct:#2E7D32; --wrong:#D32F2F; --txt-dark:#1A1A1A; --txt-soft:#555; --accent:#2B7FE0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--txt-dark);display:flex;justify-content:center;overscroll-behavior:none;}
  .app{width:100%;max-width:480px;height:100vh;height:100dvh;background:var(--bg);
    display:flex;flex-direction:column;position:relative;}

  /* ===== 히어로 ===== */
  .hero{position:absolute;inset:0;z-index:60;background:linear-gradient(165deg,#2B7FE0 0%,#1E5FB0 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:34px 24px calc(28px + env(safe-area-inset-bottom));text-align:center;overflow-y:auto;}
  .hero .badge{font-size:13px;font-weight:800;color:#1E5FB0;background:#fff;padding:7px 16px;border-radius:30px;letter-spacing:-.3px;}
  .hero .mascot{width:130px;height:130px;margin:22px 0 4px;border-radius:40px;overflow:hidden;background:rgba(255,255,255,.16);box-shadow:0 8px 24px rgba(0,0,0,.18);}
  .hero .mascot img{width:100%;height:100%;object-fit:cover;}
  .hero h1{font-size:31px;font-weight:900;color:#fff;letter-spacing:-1.3px;line-height:1.3;margin-top:8px;}
  .hero h1 span{color:var(--kakao-yellow);}
  .hero .tagline{font-size:16px;font-weight:600;color:#DCEBFA;margin:12px 0 0;line-height:1.55;word-break:keep-all;}
  /* 면책 고지 */
  .disclaimer{background:rgba(255,255,255,.97);border-radius:18px;padding:16px 18px;margin:24px 0 6px;
    text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.16);width:100%;max-width:380px;}
  .disclaimer .dh{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:900;color:#C0392B;margin-bottom:8px;}
  .disclaimer p{font-size:14px;font-weight:600;color:#444;line-height:1.6;word-break:keep-all;}
  .disclaimer p b{color:#C0392B;}
  .disclaimer .src{font-size:12.5px;color:#888;font-weight:600;margin-top:9px;padding-top:9px;border-top:1px solid #eee;line-height:1.5;}
  .hero .start{margin-top:22px;width:100%;max-width:380px;padding:19px;border:none;border-radius:18px;
    background:var(--kakao-yellow);color:var(--kakao-brown);font-size:21px;font-weight:900;cursor:pointer;
    letter-spacing:-.5px;box-shadow:0 4px 0 #D9C200;transition:transform .1s;}
  .hero .start:active{transform:translateY(2px);box-shadow:0 2px 0 #D9C200;}

  /* ===== 캐릭터 선택 ===== */
  .select{position:absolute;inset:0;z-index:50;background:linear-gradient(160deg,#EAF4FC 0%,#CFE4F5 100%);
    display:none;flex-direction:column;padding:28px 22px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;}
  .select h2{font-size:25px;font-weight:900;color:var(--kakao-brown);letter-spacing:-1px;line-height:1.35;margin-top:10px;}
  .select .lead{font-size:16px;font-weight:600;color:#436;margin:10px 0 22px;line-height:1.5;word-break:keep-all;}
  .select .lead b{color:var(--accent);}
  .mode-panel{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.72);border-radius:24px;padding:14px;margin:-4px 0 18px;box-shadow:0 6px 18px rgba(40,80,120,.12);}
  .mode-title{font-size:15px;font-weight:900;color:#25445F;margin-bottom:10px;letter-spacing:-.3px;}
  .mode-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mode-card{position:relative;border:2.5px solid #fff;background:#fff;border-radius:20px;padding:14px 13px 13px;text-align:left;font-family:inherit;cursor:pointer;box-shadow:0 3px 10px rgba(40,80,120,.10);transition:transform .12s,border-color .12s,box-shadow .12s;}
  .mode-card:active{transform:scale(.97);}
  .mode-card.selected{border-color:#2B7FE0;box-shadow:0 8px 20px rgba(43,127,224,.20);}
  .mode-card .mbadge{display:inline-block;font-size:11.5px;font-weight:900;color:#fff;background:#2B7FE0;border-radius:999px;padding:4px 8px;margin-bottom:8px;}
  .mode-card[data-mode=subjective] .mbadge{background:#6A1B9A;}
  .mode-card .mt{font-size:17px;font-weight:900;color:#172D42;letter-spacing:-.5px;}
  .mode-card .md{font-size:12.5px;font-weight:700;color:#60758A;line-height:1.45;margin-top:5px;word-break:keep-all;}
  .mode-card .check{position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#EAF0F5;color:#9AAABC;font-weight:900;font-size:13px;}
  .mode-card.selected .check{background:#2B7FE0;color:#fff;}
  .mode-guide{font-size:12.5px;font-weight:700;color:#58718B;line-height:1.45;margin-top:10px;word-break:keep-all;}
  .cards{display:flex;flex-direction:column;gap:15px;}
  .card{background:#fff;border-radius:24px;padding:17px;display:flex;gap:15px;align-items:center;
    box-shadow:0 4px 14px rgba(40,80,120,.14);cursor:pointer;border:3px solid #fff;transition:transform .12s;}
  .card:active{transform:scale(.97);}
  .card .pic{width:80px;height:80px;border-radius:22px;overflow:hidden;flex-shrink:0;background:#EAF4FC;}
  .card .pic img{width:100%;height:100%;object-fit:cover;}
  .card .meta{flex:1;min-width:0;}
  .card .meta .nm{font-size:21px;font-weight:900;color:var(--txt-dark);letter-spacing:-.5px;}
  .card .meta .role{font-size:13.5px;font-weight:700;color:var(--accent);margin:3px 0 5px;}
  .card .meta .desc{font-size:13.5px;font-weight:600;color:#666;line-height:1.45;word-break:keep-all;}
  .card .go{font-size:26px;color:#bbb;flex-shrink:0;}
  .select .mini{font-size:12px;color:#789;text-align:center;margin-top:20px;font-weight:600;line-height:1.6;word-break:keep-all;}

  /* ===== 헤더/채팅 (이전과 동일 골격) ===== */
  .header{background:var(--kakao-yellow);padding:14px 16px;display:flex;align-items:center;gap:11px;box-shadow:0 2px 6px rgba(0,0,0,.12);z-index:10;}
  .header .back{font-size:24px;color:var(--kakao-brown);font-weight:800;background:none;border:none;cursor:pointer;padding:0 4px 0 0;}
  .header .avatar{width:44px;height:44px;border-radius:15px;background:#fff;overflow:hidden;flex-shrink:0;}
  .header .avatar img{width:100%;height:100%;object-fit:cover;}
  .header .info{flex:1;min-width:0;}
  .header .info .name{font-size:19px;font-weight:800;color:var(--kakao-brown);letter-spacing:-.5px;}
  .header .info .sub{font-size:12.5px;color:var(--kakao-brown-soft);margin-top:2px;font-weight:600;}
  .header .prog{font-size:14px;font-weight:800;color:var(--kakao-brown);background:rgba(255,255,255,.55);padding:6px 11px;border-radius:20px;flex-shrink:0;}
  .progressbar{height:6px;background:rgba(255,255,255,.4);width:100%;}
  .progressbar .fill{height:100%;background:var(--kakao-brown);width:0;transition:width .4s ease;}
  .chat{flex:1;overflow-y:auto;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;}
  .chat::-webkit-scrollbar{width:0;}
  .row{display:flex;gap:9px;align-items:flex-end;animation:pop .28s ease;}
  .row.me{justify-content:flex-end;}
  @keyframes pop{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .botavatar{width:40px;height:40px;border-radius:14px;background:#EAF4FC;flex-shrink:0;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.1);}
  .botavatar img{width:100%;height:100%;object-fit:cover;}
  .stack{display:flex;flex-direction:column;gap:5px;max-width:80%;}
  .sender{font-size:13px;font-weight:700;color:#3a3a3a;margin-left:4px;}
  .bubble{background:var(--bubble-you);padding:15px 17px;border-radius:4px 20px 20px 20px;font-size:19px;line-height:1.5;font-weight:600;letter-spacing:-.4px;box-shadow:0 1px 2px rgba(0,0,0,.08);word-break:keep-all;}
  .row.me .bubble{background:var(--bubble-me);border-radius:20px 4px 20px 20px;color:var(--txt-dark);}
  .bubble .qnum{display:inline-block;font-size:13px;font-weight:800;color:#fff;background:var(--kakao-brown);padding:3px 10px;border-radius:12px;margin-bottom:9px;}
  .bubble .qnum.lv-하{background:#2E7D32;} .bubble .qnum.lv-중{background:#E08600;} .bubble .qnum.lv-상{background:#C62828;}
  .bubble .qtext{font-size:20px;font-weight:700;line-height:1.5;}
  .options{display:flex;flex-direction:column;gap:10px;max-width:80%;align-self:flex-end;width:100%;}
  .opt{background:#fff;border:2.5px solid #fff;border-radius:18px;padding:16px 18px;font-size:18px;font-weight:700;text-align:left;color:var(--txt-dark);cursor:pointer;line-height:1.45;box-shadow:0 2px 5px rgba(0,0,0,.1);transition:transform .12s;display:flex;gap:11px;align-items:flex-start;word-break:keep-all;}
  .opt:active{transform:scale(.97);}
  .opt .num{flex-shrink:0;width:28px;height:28px;border-radius:9px;background:var(--kakao-yellow);color:var(--kakao-brown);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;}
  .opt.correct{background:#E8F5E9;border-color:var(--correct);} .opt.correct .num{background:var(--correct);color:#fff;}
  .opt.wrong{background:#FFEBEE;border-color:var(--wrong);} .opt.wrong .num{background:var(--wrong);color:#fff;}
  .opt.disabled{pointer-events:none;opacity:.92;} .opt.dim{opacity:.5;}
  .explain .bubble{background:#FFF9DB;border:1.5px solid #F2E4A8;border-radius:4px 20px 20px 20px;}
  .explain .tag{display:inline-block;font-size:13px;font-weight:800;padding:3px 10px;border-radius:12px;margin-bottom:8px;color:#fff;}
  .tag.ok{background:var(--correct);} .tag.no{background:var(--wrong);}
  .explain .law{font-size:14px;font-weight:700;color:#8A6D00;margin-bottom:7px;background:#fff;display:inline-block;padding:3px 9px;border-radius:8px;}
  .explain .body{font-size:17px;line-height:1.6;font-weight:600;color:#3a2f0a;}
  .footer{padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.08);}
  .next-btn{width:100%;padding:18px;border:none;border-radius:18px;background:var(--kakao-yellow);color:var(--kakao-brown);font-size:20px;font-weight:800;cursor:pointer;letter-spacing:-.5px;box-shadow:0 3px 0 #E5CE00;transition:transform .1s;}
  .next-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #E5CE00;}
  .next-btn.hidden{display:none;}
  .result{text-align:center;background:#fff;border-radius:24px;padding:32px 24px;box-shadow:0 4px 14px rgba(0,0,0,.12);animation:pop .3s ease;margin-top:6px;}
  .result .emoji{font-size:64px;margin-bottom:12px;}
  .result h2{font-size:25px;font-weight:800;color:var(--kakao-brown);margin-bottom:6px;letter-spacing:-1px;word-break:keep-all;}
  .result .score{font-size:48px;font-weight:900;color:var(--kakao-brown);margin:8px 0;}
  .result .score small{font-size:22px;color:#999;font-weight:700;}
  .result .msg{font-size:17px;color:var(--txt-soft);font-weight:600;line-height:1.5;margin-bottom:22px;word-break:keep-all;}
  .result .stat{display:flex;justify-content:center;gap:14px;margin-bottom:24px;}
  .result .stat .box{flex:1;background:#F7F7F7;border-radius:16px;padding:14px 8px;}
  .result .stat .box .n{font-size:26px;font-weight:900;} .result .stat .box.c .n{color:var(--correct);} .result .stat .box.w .n{color:var(--wrong);}
  .result .stat .box .l{font-size:13px;color:#888;font-weight:700;margin-top:2px;}
  .result .dnote{font-size:12px;color:#aaa;font-weight:600;margin:-6px 0 18px;line-height:1.5;word-break:keep-all;}
  .result .btns{display:flex;flex-direction:column;gap:10px;}
  .result .retry,.result .change{width:100%;padding:16px;border:none;border-radius:16px;font-size:18px;font-weight:800;cursor:pointer;}
  .result .retry{background:var(--kakao-yellow);color:var(--kakao-brown);box-shadow:0 3px 0 #E5CE00;}
  .result .change{background:#EAF0F5;color:#456;}
  .result .retry:active{transform:translateY(2px);box-shadow:0 1px 0 #E5CE00;}


  
  /* ===== 2026 리프레시: 심플 히어로 ===== */
  .hero.refresh{justify-content:flex-start;background:
    linear-gradient(180deg,#EAF4FF 0%,#83BFFF 46%,#2B7FE0 100%);
    color:#fff;padding:22px 18px calc(22px + env(safe-area-inset-bottom));}
  .hero.refresh:before{content:"";position:absolute;inset:0;background:
    radial-gradient(circle at top,rgba(255,255,255,.28),transparent 38%);
    pointer-events:none;}
  .hero.refresh > *{position:relative;z-index:1;}
  .hero .hero-card{width:100%;max-width:380px;margin:10px auto 0;background:rgba(255,255,255,.9);border-radius:26px;padding:10px;box-shadow:0 16px 36px rgba(11,54,120,.16);}
  .hero .hero-card img{width:100%;display:block;border-radius:20px;object-fit:cover;}
  .hero.refresh h1{font-size:28px;font-weight:900;letter-spacing:-1.1px;line-height:1.25;margin:18px auto 0;max-width:380px;word-break:keep-all;color:#fff;text-shadow:0 2px 10px rgba(0,35,85,.16);}
  .hero.refresh .subtitle{font-size:18px;font-weight:800;color:#F4FAFF;margin:8px auto 0;line-height:1.35;word-break:keep-all;}
  .hero.refresh .caption{font-size:14px;font-weight:700;color:rgba(255,255,255,.92);margin-top:6px;}
  .hero.refresh .start{margin-top:24px;max-width:380px;background:#fff;border:none;color:#1458B8;box-shadow:0 8px 24px rgba(10,45,105,.18);padding:18px;border-radius:18px;font-size:19px;font-weight:900;}

  .bubble .qnum.lv-심화{background:#6A1B9A;}
  .subjective-box{max-width:86%;align-self:flex-end;width:100%;background:#fff;border-radius:22px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px;}
  .subjective-box textarea{width:100%;min-height:122px;border:2px solid #E3ECF7;border-radius:18px;padding:15px;font-family:inherit;font-size:17px;line-height:1.55;font-weight:600;resize:vertical;outline:none;background:#F8FBFF;color:#222;}
  .subjective-box textarea:focus{border-color:#2B7FE0;background:#fff;box-shadow:0 0 0 4px rgba(43,127,224,.10);}
  .subjective-box .hint{font-size:13px;color:#62748A;font-weight:700;line-height:1.45;word-break:keep-all;}
  .subjective-box .submit{border:none;border-radius:16px;background:#2B7FE0;color:#fff;font-size:18px;font-weight:900;padding:15px;box-shadow:0 3px 0 #155DAA;cursor:pointer;}
  .subjective-box .submit:active{transform:translateY(2px);box-shadow:0 1px 0 #155DAA;}
  .keyword-list{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
  .keyword-list span{font-size:12.5px;font-weight:900;border-radius:999px;padding:5px 8px;background:#EEF5FF;color:#2B5D97;}
  .keyword-list span.hit{background:#E8F5E9;color:#2E7D32;}
  .keyword-list span.miss{background:#FFEBEE;color:#C62828;}
  .sample-answer{margin-top:10px;background:#fff;border-left:4px solid #2B7FE0;border-radius:12px;padding:11px 12px;color:#27384A;font-size:15.5px;line-height:1.6;font-weight:700;}
  @media (max-height:720px){.hero.refresh{padding-top:16px}.hero .hero-card{max-width:340px}.hero.refresh h1{font-size:24px}.hero.refresh .subtitle{font-size:16px}.hero.refresh .start{padding:16px}}

</style>
</head>

const QUESTION_BANK = [
  // ---------- Part1 총칙 ----------
  {level:"하",slide:"1-1",q:"새마을금고법의 목적은 우리나라 고유의 무엇에 '입각'한다고 되어 있을까요?",
   options:["상부상조 정신","경쟁 우선 원칙","주주 이익 극대화","국가 독점 운영"],answer:0,law:"제1조 (목적)",
   exp:"새마을금고법은 우리나라 고유의 '상부상조 정신'에 입각하여 자금의 조성·이용, 회원 지위 향상, 지역사회 개발에 이바지함을 목적으로 합니다."},
  {level:"중",slide:"1-1",q:"강의안의 목적 암기 포인트 순서로 옳은 것은?",
   options:["상부상조 → 자금조성·이용 → 회원 지위향상 → 지역개발 → 국가경제","국가경제 → 지역개발 → 상부상조 → 자금조성 → 회원지위","자금조성 → 상부상조 → 국가경제 → 회원지위 → 지역개발","회원지위 → 국가경제 → 지역개발 → 자금조성 → 상부상조"],answer:0,law:"제1조 / 슬라이드 1-1",
   exp:"암기 포인트는 '상부상조 → 자금조성·이용 → 회원 지위향상 → 지역개발 → 국가경제' 순서입니다."},
  {level:"하",slide:"1-3",q:"새마을금고법 체계상 '국회의 의결로 제정'되는 단계는?",
   options:["헌법","법률","대통령령","부령(시행규칙)"],answer:1,law:"슬라이드 1-3 (법률 체계 위계)",
   exp:"법률은 국회 의결로 제정되며, 새마을금고법이 여기에 해당합니다. 헌법(최고규범) > 법률 > 대통령령(시행령) > 부령(시행규칙) 순입니다."},
  {level:"중",slide:"1-3",q:"새마을금고법 본문에 '대통령령으로 정한다'는 문구가 자주 나오는 이유로 가장 적절한 것은?",
   options:["법률이 헌법보다 상위여서","세부 절차·기준을 시행령에 위임하기 때문","국회를 거치지 않으려고","부령을 폐지하기 위해"],answer:1,law:"슬라이드 1-3",

         p80:["완전 잘하셨어요! 🎉","거의 다 맞히셨어요! 틀린 것만 보면 완벽해요~"],
         p60:["잘하셨어요! 😊","기본기 탄탄해요! 해설 한 번만 더 보면 돼요~"],
         p0:["힘내요 우리! 💪","처음이라 그래요~ 다시 하면 쑥쑥 올라요, 화이팅! 💖"]}},
};

let cur=0, correctCount=0, answered=false, CC=null, QUESTIONS=[], quizMode='objective';
const chat=document.getElementById('chat');
const nextBtn=document.getElementById('nextBtn');
const prog=document.getElementById('prog');
const fill=document.getElementById('fill');
const hero=document.getElementById('hero');
const selectScreen=document.getElementById('selectScreen');

function pick(a){return a[Math.floor(Math.random()*a.length)];}
function scrollBottom(){chat.scrollTop=chat.scrollHeight;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* 기본은 객관식만 출제하고, 선택 시 주관식 심화만 별도 출제 */
function getModeMeta(){
  return quizMode==='subjective'
    ? {label:'주관식 심화',short:'주관식 심화',note:'핵심어 서술형 확인'}
    : {label:'객관식 기본',short:'객관식 기본',note:'객관식 랜덤 출제'};
}
function setQuizMode(mode){
  quizMode=(mode==='subjective')?'subjective':'objective';
  document.querySelectorAll('.mode-card').forEach(btn=>{
    const on=btn.dataset.mode===quizMode;
    btn.classList.toggle('selected',on);
    btn.setAttribute('aria-pressed',on?'true':'false');
  });
  const guide=document.getElementById('modeGuide');
  if(guide){
    guide.textContent=quizMode==='subjective'
      ? '주관식 심화 모드입니다. 객관식 없이 서술형 문항만 출제되며, 핵심어 포함 여부로 학습 확인을 합니다.'
      : '객관식 기본 모드입니다. 주관식은 섞지 않고 객관식 문항만 랜덤 출제합니다.';
  }
}
function buildQuiz(){
  const subjective=QUESTION_BANK.filter(q=>q.type==='subjective');
  const objective=QUESTION_BANK.filter(q=>q.type!=='subjective');
  const source=(quizMode==='subjective')?subjective:objective;
  const want=Math.min(QUIZ_COUNT,source.length);
  return shuffle(source).slice(0,want);
}

document.querySelectorAll('.mode-card').forEach(btn=>{btn.onclick=()=>setQuizMode(btn.dataset.mode);});
setQuizMode('objective');
document.getElementById('startHero').onclick=()=>{hero.style.display='none';selectScreen.style.display='flex';renderCards();};
document.getElementById('backBtn').onclick=()=>{hero.style.display='flex';selectScreen.style.display='none';};

function renderCards(){
  const wrap=document.getElementById('cards');wrap.innerHTML='';
  ['kim','joo','kar'].forEach(key=>{const c=CHARS[key];const el=document.createElement('div');el.className='card';
    el.innerHTML=`<div class="pic"><img src="${c.img}" alt="${c.name}"></div><div class="meta"><div class="nm">${c.name}</div><div class="role">${c.role}</div><div class="desc">${c.desc}</div></div><div class="go">›</div>`;
    el.onclick=()=>startQuiz(key);wrap.appendChild(el);});
}

function startQuiz(key){
  CC=CHARS[key];QUESTIONS=buildQuiz();
  document.getElementById('hAvatar').innerHTML=`<img src="${CC.img}" alt="${CC.name}">`;
  document.getElementById('hName').textContent=(key==='kim'?'MG인재개발원':CC.name);
  document.getElementById('hSub').textContent=CC.role+' · '+getModeMeta().short;
  selectScreen.style.display='none';hero.style.display='none';
  chat.innerHTML='';cur=0;correctCount=0;answered=false;
  const modeMeta=getModeMeta();
  botSay(`<div class="bubble">${CC.intro}<br><span style="font-size:14px;color:#888;">(이번 회차 ${QUESTIONS.length}문제 · ${modeMeta.label} · ${modeMeta.note} · 학습용)</span></div>`);
  setTimeout(renderQuestion,600);
}

function botSay(html,cls=""){
  const row=document.createElement('div');row.className='row '+cls;
  row.innerHTML=`<div class="botavatar"><img src="${CC.img}" alt=""></div><div class="stack"><div class="sender">${CC.sender}</div>${html}</div>`;
  chat.appendChild(row);scrollBottom();return row;
}

function renderQuestion(){
  answered=false;nextBtn.classList.add('hidden');
  const Q=QUESTIONS[cur];
  prog.textContent=(cur+1)+'/'+QUESTIONS.length;
  fill.style.width=((cur)/QUESTIONS.length*100)+'%';
  const mode=(Q.type==='subjective')?'주관식 심화':'객관식';
  botSay(`<div class="bubble"><span class="qnum lv-${Q.level}">Q${cur+1} · ${mode} · 난이도 ${Q.level} · 슬라이드 ${Q.slide}</span><div class="qtext">${Q.q}</div></div>`);
  if(Q.type==='subjective'){
    renderSubjectiveInput(Q);
    return;
  }
  const opts=document.createElement('div');opts.className='options';
  Q.options.forEach((text,i)=>{const b=document.createElement('button');b.className='opt';
    b.innerHTML=`<span class="num">${i+1}</span><span>${text}</span>`;b.onclick=()=>choose(i,opts,Q);opts.appendChild(b);});
  chat.appendChild(opts);scrollBottom();
}

function choose(idx,optsEl,Q){
  if(answered)return;answered=true;
  const buttons=[...optsEl.querySelectorAll('.opt')];const isCorrect=(idx===Q.answer);
  buttons.forEach((b,i)=>{b.classList.add('disabled');
    if(i===Q.answer)b.classList.add('correct');if(i===idx&&!isCorrect)b.classList.add('wrong');
    if(i!==Q.answer&&i!==idx)b.classList.add('dim');});
  const me=document.createElement('div');me.className='row me';me.innerHTML=`<div class="bubble">${idx+1}번이요!</div>`;chat.appendChild(me);
  if(isCorrect)correctCount++;
  setTimeout(()=>{
    let tag,reaction;
    if(isCorrect){tag=`<span class="tag ok">⭕ 정답</span>`;reaction=pick(CC.ok);}
    else{tag=`<span class="tag no">❌ 오답</span>`;reaction=pick(CC.no).replace(/__A__/g,(Q.answer+1));}
    botSay(`<div class="bubble">${tag}<div style="font-weight:800;margin-bottom:8px;color:${isCorrect?'#2E7D32':'#C62828'};">${reaction}</div><div class="law">📖 ${Q.law}</div><div style="font-size:14px;font-weight:700;color:#8A6D00;margin:6px 0 4px;">${CC.lead}</div><div class="body">${Q.exp}</div></div>`,'explain');
    fill.style.width=((cur+1)/QUESTIONS.length*100)+'%';
    nextBtn.textContent=(cur===QUESTIONS.length-1)?"결과 확인하기 🎉":"다음 문제 ▶";
    nextBtn.classList.remove('hidden');scrollBottom();
  },350);
}

function escapeHtml(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,'');}
function checkKeywords(answer,Q){
  const clean=norm(answer);
  return (Q.keywords||[]).map((kw,i)=>{
    const terms=Array.isArray(kw)?kw:[kw];
    const ok=terms.some(t=>clean.includes(norm(t)));
    const label=(Q.keywordLabels&&Q.keywordLabels[i])?Q.keywordLabels[i]:terms.join('/');
    return {label,ok};
  });
}
function renderSubjectiveInput(Q){
  const box=document.createElement('div');box.className='subjective-box';
  box.innerHTML=`<textarea id="subjectiveAnswer" maxlength="500" placeholder="핵심어를 넣어 2~5문장 정도로 자유롭게 작성해보세요."></textarea><div class="hint">💡 자동채점은 핵심어 포함 여부를 기준으로 한 학습용 확인입니다. 실제 평가는 문맥과 정확성을 함께 봐야 해요.</div><button class="submit" id="submitSubjective">답안 제출하기 ✍️</button>`;
  chat.appendChild(box);scrollBottom();
  box.querySelector('#submitSubjective').onclick=()=>submitSubjective(Q,box);
}
function submitSubjective(Q,box){
  if(answered)return;
  const ta=box.querySelector('textarea');
  const answer=ta.value.trim();
  if(!answer){ta.focus();return;}
  answered=true;ta.disabled=true;box.querySelector('button').disabled=true;
  const checks=checkKeywords(answer,Q);
  const hit=checks.filter(x=>x.ok).length;
  const needed=Q.minHit||Math.ceil((Q.keywords||[]).length*0.6);
  const isCorrect=hit>=needed;
  if(isCorrect)correctCount++;
  const me=document.createElement('div');me.className='row me';me.innerHTML=`<div class="bubble">${escapeHtml(answer).replace(/\n/g,'<br>')}</div>`;chat.appendChild(me);
  setTimeout(()=>{
    const tag=isCorrect?`<span class="tag ok">⭕ 핵심어 충족</span>`:`<span class="tag no">❌ 보완 필요</span>`;
    const reaction=isCorrect?pick(CC.ok):`핵심어 ${hit}/${checks.length}개가 확인됐어요. 모범 문장과 비교해 보세요.`;
    const keywords=checks.map(x=>`<span class="${x.ok?'hit':'miss'}">${x.ok?'✓':'+'} ${x.label}</span>`).join('');
    botSay(`<div class="bubble">${tag}<div style="font-weight:800;margin-bottom:8px;color:${isCorrect?'#2E7D32':'#C62828'};">${reaction}</div><div class="law">📖 ${Q.law}</div><div style="font-size:14px;font-weight:700;color:#8A6D00;margin:6px 0 4px;">핵심어 체크</div><div class="keyword-list">${keywords}</div><div class="sample-answer"><b>예시 답안</b><br>${Q.sampleAnswer}</div><div class="body" style="margin-top:10px;">${Q.exp}</div></div>`,'explain');
    fill.style.width=((cur+1)/QUESTIONS.length*100)+'%';
    nextBtn.textContent=(cur===QUESTIONS.length-1)?"결과 확인하기 🎉":"다음 문제 ▶";
    nextBtn.classList.remove('hidden');scrollBottom();
  },350);
}

nextBtn.onclick=()=>{if(cur===QUESTIONS.length-1){showResult();return;}cur++;renderQuestion();};

function showResult(){
  nextBtn.classList.add('hidden');prog.textContent='완료';
  const total=QUESTIONS.length,wrong=total-correctCount,pct=Math.round(correctCount/total*100);
  let key,emoji;
  if(pct===100){key='p100';emoji='🏆';}else if(pct>=80){key='p80';emoji='🎉';}
  else if(pct>=60){key='p60';emoji='😊';}else{key='p0';emoji='💪';}
  const [title,msg]=CC.end[key];
  const r=document.createElement('div');r.className='row';
  r.innerHTML=`<div class="stack" style="max-width:100%;width:100%;"><div class="result"><div class="emoji">${emoji}</div><h2>${title}</h2><div class="score">${correctCount}<small>/${total}</small></div><div class="msg">${msg}</div><div class="stat"><div class="box c"><div class="n">${correctCount}</div><div class="l">맞은 문제</div></div><div class="box w"><div class="n">${wrong}</div><div class="l">틀린 문제</div></div><div class="box"><div class="n">${pct}%</div><div class="l">정답률</div></div></div><div class="dnote">※ 본 점수는 학습 참고용입니다. 정확한 내용은 법령 원문을 확인하세요.</div><div class="btns"><button class="retry" id="retry">새 문제로 다시 풀기 🔄</button><button class="change" id="change">다른 친구로 바꾸기 🔀</button></div></div></div>`;
  chat.appendChild(r);fill.style.width='100%';scrollBottom();
  document.getElementById('retry').onclick=()=>startQuiz(Object.keys(CHARS).find(k=>CHARS[k]===CC));
  document.getElementById('change').onclick=()=>{selectScreen.style.display='flex';};
}
</script>
</body>
</html>
